  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 32 32" fill="none"><circle cx="7" cy="8" r="3.5" fill="currentColor"/><line x1="10" y1="11" x2="11" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="14" cy="23" r="3.5" fill="currentColor"/><line x1="17" y1="21" x2="23" y2="16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="26" cy="13" r="3.5" fill="currentColor"/></svg></div>

          </span>
        </button>
        <a href="#" id="logoutBtn" class="logout-link">Sign out</a>

  <main class="main">
    <div class="page-head">
      <div>
        <p class="page-eyebrow">Immutable record</p>
        <h1 class="page-title">Audit Log</h1>
        <p class="page-sub">Every action in the system, chained by hash so tampering with history is detectable.</p>
      </div>
      <button class="btn btn-primary" id="verifyBtn">Verify chain integrity</button>
    </div>

    <div class="card hidden" id="verifyCard">
      <div class="chain-banner" id="chainBanner"></div>
      <div class="chain-strip" id="chainStrip"></div>
    </div>

    <div class="card">
      <div class="filter-bar" style="margin-bottom:14px;">
        <select id="filterAction">
          <option value="">All actions</option>
        </select>
        <input type="text" id="filterActor" placeholder="Filter by actor…">
        <div class="spacer"></div>
        <span class="text-faint mono" id="logCount" style="font-size:12px;"></span>
      </div>
      <div class="table-wrap">
        <table id="auditTable">
          <thead>
            <tr><th data-sort="timestamp">Timestamp <span class="sort-arrow"></span></th><th data-sort="actor">Actor <span class="sort-arrow"></span></th><th data-sort="action">Action <span class="sort-arrow"></span></th><th data-sort="entity_type">Entity <span class="sort-arrow"></span></th><th data-sort="details">Details <span class="sort-arrow"></span></th><th>Hash</th></tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
      <div id="logPagination"></div>
    </div>
  </main>
  <div class="sidebar-backdrop"></div>
</div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
  initShell('audit');

  const filterAction = document.getElementById('filterAction');
  const filterActor = document.getElementById('filterActor');
  const logBody = document.getElementById('logBody');
  const logCount = document.getElementById('logCount');
  const sortState = { col: null, asc: true };

  function applySort(data) {
    if (!sortState.col) return data;
    return data.slice().sort((a, b) => {
      const va = a[sortState.col];
      const vb = b[sortState.col];
      let cmp;
      if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
      else cmp = String(va).localeCompare(String(vb));
      return sortState.asc ? cmp : -cmp;
    });
  }

  const paginator = makePaginated(document.getElementById('logPagination'), 10, renderLog);

  function populateActionFilter() {
    const actions = [...new Set(Store.getAuditLog().map(a => a.action))];
    filterAction.innerHTML = '<option value="">All actions</option>' +
      actions.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a.replaceAll('_',' '))}</option>`).join('');
  }

  function renderLog() {
    let log = Store.getAuditLog().slice();
    if (filterAction.value) log = log.filter(a => a.action === filterAction.value);
    const actorQuery = filterActor.value.trim().toLowerCase();
    if (actorQuery) log = log.filter(a => a.actor.toLowerCase().includes(actorQuery));

    log = applySort(log);

    logCount.textContent = log.length + ' entries';

    const page = paginator.getPage();
    const pageSize = 10;
    const totalPages = Math.max(1, Math.ceil(log.length / pageSize));
    const start = (Math.min(page, totalPages) - 1) * pageSize;
    const pageItems = log.slice(start, start + pageSize);

    if (!pageItems.length) {
      logBody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="glyph">≡</div><p>No matching audit entries.</p></div></td></tr>`;
      paginator.render(0);
      return;
    }

    logBody.innerHTML = pageItems.map(a => `
      <tr>
        <td class="mono text-dim">${formatDateTime(a.timestamp)}</td>
        <td>${escapeHtml(a.actor)}</td>
        <td class="mono">${escapeHtml(a.action)}</td>
        <td class="text-dim">${escapeHtml(a.entity_type)} · ${escapeHtml(a.entity_id)}</td>
        <td class="text-dim">${escapeHtml(a.details)}</td>
        <td class="mono text-faint" title="${escapeHtml(a.hash)}">${escapeHtml(a.hash.slice(0,8))}…</td>
      </tr>
    `).join('');

    paginator.render(log.length);
  }

  document.getElementById('verifyBtn').addEventListener('click', () => {
    // TODO(PHP): replace with fetch('api/audit_verify.php') which recomputes
    // sha256 chains server-side against the append-only MySQL table.
    const { intact, results } = Store.verifyAuditChain();

    const card = document.getElementById('verifyCard');
    const banner = document.getElementById('chainBanner');
    const strip = document.getElementById('chainStrip');
    card.classList.remove('hidden');

    banner.className = 'chain-banner ' + (intact ? 'ok' : 'bad');
    banner.textContent = intact
      ? `Chain verified — all ${results.length} entries are intact and in order.`
      : `Integrity check failed — the hash chain has been broken. History may have been altered.`;

    if (!results.length) {
      strip.innerHTML = `<span class="text-faint" style="font-size:12.5px;">No entries to verify yet.</span>`;
    } else {
      strip.innerHTML = results.map(r => `
        <div class="chain-node">
          <div class="chain-line ${r.verified ? '' : 'broken'}"></div>
          <div class="chain-dot ${r.verified ? '' : 'broken'}" title="${escapeHtml(r.action)}"></div>
          <div class="chain-hash">${escapeHtml(r.hash.slice(0,6))}</div>
        </div>
      `).join('');
    }

    toast(intact ? 'Audit chain verified successfully.' : 'Audit chain integrity check failed.', intact ? undefined : 'error');
  });

  filterAction.addEventListener('change', () => { paginator.reset(); renderLog(); });
  filterActor.addEventListener('input', () => { paginator.reset(); renderLog(); });

  makeSortable(document.getElementById('auditTable'), sortState, renderLog);
  populateActionFilter();
  renderLog();
</script>
</body>
